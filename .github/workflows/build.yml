name: Build
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  check-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version match
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep '^version = ' client/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Tag version: $TAG_VERSION"
          echo "Cargo version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build client
        env:
          PV_SERVER: ${{ vars.PV_SERVER }}
        run: |
          if ([string]::IsNullOrEmpty($env:PV_SERVER)) {
            Write-Error "PV_SERVER variable is not set"
            exit 1
          }
          cargo build --release -p client
      - name: Rename executable
        run: Copy-Item target\release\client.exe PixelVillage.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PixelVillage-windows
          path: PixelVillage.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 1.95 and Android targets
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup target add armv7-linux-androideabi aarch64-linux-android

      - name: Restore Android keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Set version_code from run_number
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sed -i "s/^version_code = .*/version_code = ${{ github.run_number }}/" client/Cargo.toml
          cat client/Cargo.toml | grep version_code

      - name: Install cargo-quad-apk
        run: cargo +1.95.0 install --git https://github.com/hoklims/cargo-quad-apk cargo-quad-apk

      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        env:
          PV_SERVER: ${{ vars.PV_SERVER }}
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cd client
          cargo quad-apk build --release

      - name: Find and rename APK
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" PixelVillage-android.apk
            echo "apk_found=true" >> $GITHUB_OUTPUT
          else
            echo "apk_found=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/upload-artifact@v4
        if: steps.find_apk.outputs.apk_found == 'true'
        with:
          name: PixelVillage-android
          path: PixelVillage-android.apk

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        timeout-minutes: 8
        run: |
          # Use official Ubuntu mirrors instead of Azure
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list || true

          # Retry apt-get update up to 3 times with 60s timeout
          for i in 1 2 3; do
            echo "Attempt $i: apt-get update"
            if timeout 60 sudo apt-get update 2>&1; then
              echo "✓ apt-get update successful"
              break
            fi
            if [ $i -eq 3 ]; then
              echo "✗ apt-get update failed after 3 attempts"
              exit 1
            fi
            echo "Retrying in 3 seconds..."
            sleep 3
          done

          # Ubuntu 26.04 uses new package names
          sudo apt-get install -y \
            libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev || \
          sudo apt-get install -y \
            libx11-6-dev libxi6-dev libgl-dev libasound-dev \
            libxcursor1-dev libxrandr2-dev libxinerama1-dev
      - name: Build client
        env:
          PV_SERVER: ${{ vars.PV_SERVER }}
        run: |
          if [ -z "$PV_SERVER" ]; then
            echo "Error: PV_SERVER variable is not set"
            exit 1
          fi
          cargo build --release -p client
      - name: Rename executable
        run: |
          cp target/release/client PixelVillage
          chmod +x PixelVillage
      - uses: actions/upload-artifact@v4
        with:
          name: PixelVillage-linux
          path: PixelVillage

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build client
        env:
          PV_SERVER: ${{ vars.PV_SERVER }}
        run: |
          if [ -z "$PV_SERVER" ]; then
            echo "Error: PV_SERVER variable is not set"
            exit 1
          fi
          cargo build --release -p client
      - name: Create macOS app bundle
        run: |
          mkdir -p PixelVillage.app/Contents/MacOS
          mkdir -p PixelVillage.app/Contents/Resources
          cp target/release/client PixelVillage.app/Contents/MacOS/PixelVillage
          chmod +x PixelVillage.app/Contents/MacOS/PixelVillage

          # Create Info.plist
          cat > PixelVillage.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Pixel Village</string>
              <key>CFBundleDisplayName</key>
              <string>Pixel Village</string>
              <key>CFBundleIdentifier</key>
              <string>com.gertyn.pixelvillage</string>
              <key>CFBundleVersion</key>
              <string>${GITHUB_REF_NAME#v}</string>
              <key>CFBundleShortVersionString</key>
              <string>${GITHUB_REF_NAME#v}</string>
              <key>CFBundleExecutable</key>
              <string>PixelVillage</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Create DMG
          hdiutil create -volname "Pixel Village" -srcfolder PixelVillage.app -ov -format UDZO PixelVillage-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: PixelVillage-macos
          path: PixelVillage-macOS.dmg

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install iOS targets
        run: |
          rustup target add aarch64-apple-ios x86_64-apple-ios

      - name: Install cargo-mobile2
        run: cargo install --git https://github.com/tauri-apps/cargo-mobile2

      - name: Check if cargo-mobile2 config exists
        id: check_mobile
        run: |
          if [ -f ".cargo-mobile/config.toml" ]; then
            echo "has_config=true" >> $GITHUB_OUTPUT
          else
            echo "has_config=false" >> $GITHUB_OUTPUT
            echo "⚠️ iOS build not configured yet. Run 'cargo mobile init' locally first."
          fi

      - name: Build iOS
        if: steps.check_mobile.outputs.has_config == 'true'
        env:
          PV_SERVER: ${{ vars.PV_SERVER }}
        run: |
          cd client
          cargo apple build --release aarch64

      - name: Package IPA
        if: steps.check_mobile.outputs.has_config == 'true'
        run: |
          # Find the .app bundle in target directory
          APP_PATH=$(find target -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r PixelVillage-iOS.ipa Payload
            echo "ipa_found=true" >> $GITHUB_OUTPUT
          else
            echo "ipa_found=false" >> $GITHUB_OUTPUT
          fi
        id: package_ipa

      - uses: actions/upload-artifact@v4
        if: steps.check_mobile.outputs.has_config == 'true' && steps.package_ipa.outputs.ipa_found == 'true'
        with:
          name: PixelVillage-ios
          path: PixelVillage-iOS.ipa
        continue-on-error: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check-version, windows, android, linux, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: PixelVillage-windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: PixelVillage-linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: PixelVillage-macos
        continue-on-error: true

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: PixelVillage-android
        continue-on-error: true

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: PixelVillage-ios
        continue-on-error: true

      - name: Calculate SHA256
        run: |
          sha256sum PixelVillage.exe | awk '{print $1}' > sha256.txt
          SHA256=$(cat sha256.txt)
          SIZE=$(stat -c%s PixelVillage.exe)
          echo "SHA256: $SHA256"
          echo "Size: $SIZE bytes"
          echo "sha256=$SHA256" >> $GITHUB_ENV
          echo "size=$SIZE" >> $GITHUB_ENV

      - name: Generate latest.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          # Extract notes from CHANGELOG.md or tag message
          if [ -f CHANGELOG.md ]; then
            NOTES=$(grep -A 10 "## \[${TAG_VERSION}\]" CHANGELOG.md | tail -n +2 | sed '/^## /q' | sed '$d' || echo "Update to version ${TAG_VERSION}")
          else
            NOTES="Update to version ${TAG_VERSION}"
          fi

          # Escape for JSON
          NOTES_JSON=$(echo "$NOTES" | jq -Rs .)

          cat > latest.json <<EOF
          {
            "version": "${TAG_VERSION}",
            "sha256": "${sha256}",
            "size": ${size},
            "notes": ${NOTES_JSON}
          }
          EOF

          cat latest.json

      - name: Create GitHub Release in game-releases
        uses: softprops/action-gh-release@v1
        with:
          repository: gertyn230/game-releases
          tag_name: ${{ github.ref_name }}
          name: Pixel Village ${{ github.ref_name }}
          body: |
            🎮 **Pixel Village ${{ github.ref_name }}**

            ## 🚀 Автоматичне оновлення
            Гра тепер оновлюється автоматично! Просто запустіть старішу версію і з'явиться вікно з кнопкою "Встановити".

            ## 📥 Завантажити
            - **Windows**: [PixelVillage.exe](https://github.com/gertyn230/game-releases/releases/download/${{ github.ref_name }}/PixelVillage.exe)
            - **macOS**: [PixelVillage-macOS.dmg](https://github.com/gertyn230/game-releases/releases/download/${{ github.ref_name }}/PixelVillage-macOS.dmg)
            - **Linux**: [PixelVillage](https://github.com/gertyn230/game-releases/releases/download/${{ github.ref_name }}/PixelVillage)
            - **Android**: [PixelVillage-android.apk](https://github.com/gertyn230/game-releases/releases/download/${{ github.ref_name }}/PixelVillage-android.apk)
            - **iOS**: [PixelVillage-iOS.ipa](https://github.com/gertyn230/game-releases/releases/download/${{ github.ref_name }}/PixelVillage-iOS.ipa) (потрібен джейлбрейк або developer account)

            ## 📱 Сайт
            https://gertyn230.github.io/game-releases/
          files: |
            PixelVillage.exe
            PixelVillage
            PixelVillage-macOS.dmg
            latest.json
            PixelVillage-android.apk
            PixelVillage-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p server
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: target/release/server
