name: Telegram Announcement

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.2.0)'
        required: true
      changes_ua:
        description: 'Changes (Ukrainian)'
        required: true
      changes_en:
        description: 'Changes (English)'
        required: true

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ukrainian announcement
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -H "Content-Type: application/json" \
          -d "{\"chat_id\":\"@pixel_village\",\"text\":\"🎮 *Pixel Village v${{ github.event.inputs.version }} — Оновлення!*\n\n${{ github.event.inputs.changes_ua }}\n\n📥 *ЗАВАНТАЖИТИ:*\n[GitHub Actions](https://github.com/gertyn230/game/actions)\n\nГарної гри! 🏡✨\",\"parse_mode\":\"Markdown\"}"

      - name: Send English announcement
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -H "Content-Type: application/json" \
          -d "{\"chat_id\":\"@pixel_village\",\"text\":\"🎮 *Pixel Village v${{ github.event.inputs.version }} — Update!*\n\n${{ github.event.inputs.changes_en }}\n\n📥 *DOWNLOAD:*\n[GitHub Actions](https://github.com/gertyn230/game/actions)\n\nEnjoy! 🏡✨\",\"parse_mode\":\"Markdown\"}"
