name: Telegram Notify
on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get commit info
        id: commit
        run: |
          echo "message=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_OUTPUT
          echo "hash=$(git log -1 --pretty=%h)" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=%an)" >> $GITHUB_OUTPUT

      - name: Send to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: "@pixel_village"
        run: |
          MESSAGE="🔄 **New Update / Нове оновлення**

**EN:**
📝 Commit: ${{ steps.commit.outputs.message }}
👤 Author: ${{ steps.commit.outputs.author }}
🔗 [View changes](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

**UA:**
📝 Коміт: ${{ steps.commit.outputs.message }}
👤 Автор: ${{ steps.commit.outputs.author }}
🔗 [Переглянути зміни](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

📦 \`${{ steps.commit.outputs.hash }}\`"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT}\",\"text\":\"${MESSAGE}\",\"parse_mode\":\"Markdown\",\"disable_web_page_preview\":true}"
