name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release -p client

      - name: Rename executable
        run: |
          $version = "${{ github.ref_name }}"
          Copy-Item "target/release/client.exe" "PixelVillage-$version-Windows.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: windows-exe
          path: PixelVillage-*.exe

  create-release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v3
        with:
          name: windows-exe

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Pixel Village v${{ steps.version.outputs.VERSION }}
          body: |
            🎮 **Pixel Village v${{ steps.version.outputs.VERSION }}**

            ## ✨ What's New:

            Check the commit history for detailed changes.

            ## 📥 Downloads:

            - **Windows**: PixelVillage-v${{ steps.version.outputs.VERSION }}-Windows.exe

            ## 🎯 Features:

            - Auto-update system
            - Cross-platform support (Windows, Android)
            - Beautiful UI
            - Survival mechanics
            - Crafting system
            - Multiplayer support

            ---

            **Developer:** @gertyn230
            **Channel:** @pixel_village
          files: |
            PixelVillage-*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
