name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release -p client

      - name: Prepare release
        run: |
          $version = "${{ github.ref_name }}"
          Copy-Item "target/release/client.exe" "PixelVillage-$version-Windows.exe"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Pixel Village ${{ github.ref_name }}
          body: |
            🎮 **Pixel Village ${{ github.ref_name }}**

            Auto-update system integrated!

            📥 Download: PixelVillage-${{ github.ref_name }}-Windows.exe
          files: PixelVillage-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
