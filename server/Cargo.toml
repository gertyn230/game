[package]
name = "server"
version = "1.6.4"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
chrono = "0.4"
urlencoding = "2.1"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
